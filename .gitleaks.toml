# Secret scanner config. One home for the ruleset; the pre-commit hook, scripts/gate and CI all point here.
# Allowlists stay narrow: anchor to a whole line and a specific value shape, never a whole file,
# so a real value pasted into .env.example still trips the scan.
# Project-specific rules for this project's highest-value secrets are added here once those secrets exist,
# each probed with a realistic-shaped fake key to confirm it fires.
title = "zaapi-take-home"

[extend]
useDefault = true

[allowlist]
description = "Placeholder values in .env.example"
regexTarget = "line"
regexes = ['''^[A-Z0-9_]+=replace-me$''']
