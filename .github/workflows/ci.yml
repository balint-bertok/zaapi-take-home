# CI runs the same gate as the dev machine. The weekly run catches drift between PRs
# (scanner download failing, action deprecation, dependency break) instead of surfacing mid-merge.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # secret scan covers the full history
      - name: Install gitleaks (pinned to .gitleaks-version, same as the dev machine)
        run: |
          set -euo pipefail
          v="$(cat .gitleaks-version)"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # same major as the dev machine
          cache: npm
      - run: npm ci
      - name: Install the Playwright browser the invariant suites drive
        run: npx playwright install --with-deps chromium
      - run: scripts/gate
